<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team - ConstructFlow</title>
  <link rel="stylesheet" href="app.css">
  <script src="app-store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header id="header" class="site-header"></header>
  <main class="app-main">
    <div id="message" role="status" aria-live="polite" tabindex="-1"></div>
    <div id="content"><p>Loading project records…</p></div>
    <noscript>Enable JavaScript to manage project records.</noscript>
  </main>
  <footer>ConstructFlow · Construction Project Management</footer>
  <dialog id="confirmation" aria-labelledby="confirmation-title">
    <h2 id="confirmation-title">Confirm action</h2>
    <div class="actions">
      <button id="confirmation-action" class="button danger" type="button">Confirm</button>
      <button class="button secondary" type="button" data-action="close-dialog">Cancel</button>
    </div>
  </dialog>
</body>
</html>
